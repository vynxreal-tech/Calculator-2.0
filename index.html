<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuristic JS Calculator</title>
  <style>
    /* Global fix for the blue tap highlight box */
    * {
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
    }

    .calculator {
      background: rgba(0,0,0,0.4);
      padding: 25px;
      border-radius: 25px;
      box-shadow: 0 0 30px rgba(0,255,255,0.2), 0 10px 30px rgba(0,0,0,0.5);
      width: 280px;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .calculator:hover {
      transform: scale(1.02);
    }

    #display {
      width: 95%;
      padding: 15px;
      margin-bottom: 15px;
      font-size: 24px;
      border-radius: 15px;
      border: none;
      text-align: right;
      background: rgba(255,255,255,0.1);
      color: #00ffff;
      box-shadow: inset 0 0 10px rgba(0,255,255,0.3);
      transition: box-shadow 0.2s ease;
    }

    #display:focus {
      outline: none;
      box-shadow: inset 0 0 20px rgba(0,255,255,0.6);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 18px;
      font-size: 20px;
      border-radius: 15px;
      border: none;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      color: #00ffff;
      box-shadow: 0 4px 6px rgba(0,255,255,0.2);
      transition: all 0.15s ease;
      /* Mobile fix for blue box */
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: rgba(255,255,255,0.2);
      box-shadow: 0 6px 10px rgba(0,255,255,0.4);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 4px rgba(0,255,255,0.2);
    }

    button.operator {
      background: rgba(0,255,255,0.2);
      color: #000;
      font-weight: bold;
    }

    button.operator:hover {
      background: rgba(0,255,255,0.4);
      color: #000;
    }

    button.clear {
      grid-column: span 4;
      background: rgba(255,0,0,0.3);
      color: #fff;
      font-weight: bold;
    }

    button.clear:hover {
      background: rgba(255,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" placeholder="0" disabled>

    <div class="buttons">
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button class="operator" onclick="press('/')">÷</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button class="operator" onclick="press('*')">×</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button class="operator" onclick="press('-')">-</button>

      <button onclick="press('0')">0</button>
      <button onclick="press('.')">.</button>
      <button class="operator" onclick="calculate()">=</button>
      <button class="operator" onclick="press('+')">+</button>

      <button class="clear" onclick="clearDisplay()">C</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function press(value) {
      display.value += value;
      animateDisplay();
    }

    function calculate() {
      try {
        // Use Function() instead of eval() for slightly better practice
        display.value = new Function('return ' + display.value)();
        animateDisplay();
      } catch {
        display.value = "Error";
      }
    }

    function clearDisplay() {
      display.value = '';
      animateDisplay();
    }

    function animateDisplay() {
      display.style.transition = "none";
      display.style.transform = "scale(1.05)";
      setTimeout(() => {
        display.style.transition = "transform 0.15s ease";
        display.style.transform = "scale(1)";
      }, 50);
    }
  </script>

</body>
</html>
